<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordonne 오늘의 페어링 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --linen:#E8E0D1;
  --paper:#F3EEE4;
  --olive:#5E6A3B;
  --olive-soft:#A6AA84;
  --navy:#1D2A44;
  --muted:#6C6B5F;
  --line:#CBC2AF;
  --ko:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --lat:'Jost','IBM Plex Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--linen);color:var(--navy);font-family:var(--ko);font-weight:400;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--olive);outline-offset:3px}
a{color:inherit}

/* ---------- shell ---------- */
.shell{min-height:100vh;min-height:100dvh;max-width:460px;margin:0 auto;padding:26px 24px 40px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;min-height:32px}
.wordmark{font-family:var(--lat);font-weight:400;font-size:17px;letter-spacing:.06em;color:var(--navy);background:none;border:0;padding:0}
.lang-switch{background:none;border:0;padding:6px 0;font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.grow{flex:1}

/* lamination mark */
.layers line{stroke:var(--navy);stroke-width:2.2;stroke-linecap:round}
.layers.olive line{stroke:var(--olive)}

/* ---------- language ---------- */
.lang-screen{justify-content:center;text-align:center}
.lang-screen .layers{width:84px;margin:0 auto 26px}
.brand{font-family:var(--lat);font-weight:300;font-size:52px;letter-spacing:.05em;line-height:1;margin:0}
.slogan{font-family:var(--lat);font-weight:400;font-size:15px;letter-spacing:.04em;color:var(--olive);margin:14px 0 0}
.brand-note{font-size:13px;color:var(--muted);margin:6px 0 0}
.lang-choices{margin-top:52px;display:grid;gap:12px}
.lang-btn{display:flex;align-items:baseline;justify-content:space-between;width:100%;padding:20px 22px;background:var(--paper);border:1px solid var(--line);border-radius:2px;text-align:left;transition:border-color .2s,background .2s}
.lang-btn:hover{border-color:var(--navy)}
.lang-btn strong{font-weight:500;font-size:18px}
.lang-btn span{font-family:var(--lat);font-size:13px;color:var(--muted)}
.table-tag{margin-top:36px;font-family:var(--lat);font-size:13px;color:var(--muted)}

/* ---------- intro ---------- */
.intro-body{margin-top:auto;padding-top:56px}
.intro-body .layers{width:64px;margin-bottom:34px}
.h1{font-size:31px;font-weight:500;line-height:1.3;letter-spacing:-.01em;margin:0}
.lead{font-size:17px;color:var(--olive);margin:14px 0 0;line-height:1.55}
.desc{font-size:15px;color:var(--muted);margin:28px 0 0;max-width:34em}
.meta{font-family:var(--lat);font-size:13px;color:var(--muted);margin-top:10px}
.primary{display:block;width:100%;margin-top:40px;padding:17px 20px;background:var(--navy);color:var(--paper);border:0;border-radius:2px;font-size:16px;font-weight:500;letter-spacing:.02em;transition:background .2s}
.primary:hover{background:#2A3A5C}
.primary:disabled{background:#8D93A1;cursor:default}
.ghost{display:block;width:100%;padding:15px 20px;background:none;border:1px solid var(--navy);border-radius:2px;font-size:15px;font-weight:500}
.ghost:hover{background:var(--paper)}

/* ---------- question ---------- */
.progress{display:flex;align-items:center;gap:10px}
.progress-stack{display:grid;gap:3px}
.progress-stack i{display:block;width:26px;height:2px;border-radius:2px;background:var(--line)}
.progress-stack i.done{background:var(--olive)}
.progress-stack i.now{background:var(--navy)}
.progress-num{font-family:var(--lat);font-size:13px;color:var(--muted);min-width:28px;text-align:right}
.q-body{margin-top:clamp(40px,14vh,140px)}
.q-title{font-size:25px;font-weight:500;line-height:1.38;margin:0 0 28px}
.options{display:grid;gap:10px}
.opt{display:block;width:100%;padding:17px 20px;background:var(--paper);border:1px solid var(--line);border-radius:2px;text-align:left;font-size:16px;line-height:1.45;transition:background .18s,border-color .18s,color .18s}
.opt:hover{border-color:var(--navy)}
.opt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.back{margin-top:22px;background:none;border:0;padding:6px 0;font-size:14px;color:var(--muted)}

/* ---------- result ---------- */
.result-head{margin-top:34px}
.result-head .layers{width:72px}
.result-label{font-size:14px;color:var(--olive);margin:24px 0 0}
.no{font-family:var(--lat);font-weight:400;font-size:14px;letter-spacing:.04em;color:var(--muted);margin:0}
.r-title{font-size:30px;font-weight:500;line-height:1.3;margin:6px 0 0}
.pair{margin:26px 0 0;padding:22px 0;border-top:1px solid var(--navy);border-bottom:1px solid var(--line)}
.pair-row{display:grid;grid-template-columns:62px 1fr;align-items:baseline;gap:8px}
.pair-row + .pair-row{margin-top:10px}
.pair-kind{font-size:13px;color:var(--muted)}
.pair-name{font-size:20px;font-weight:500;line-height:1.35}
.pair-plus{font-family:var(--lat);color:var(--olive);font-size:18px;line-height:1;margin:6px 0 0 70px}
body.demo{padding-bottom:56px}
.r-desc{font-size:16px;line-height:1.75;margin:22px 0 0}
.keywords{margin:18px 0 0;font-size:13px;color:var(--olive)}
.keywords span + span::before{content:"/";margin:0 8px;color:var(--olive-soft)}
.order-note{margin-top:26px;padding:14px 16px;background:var(--paper);border-left:2px solid var(--olive);font-size:14px;color:var(--navy)}
.alt{margin-top:34px}
.alt h3,.review h3{font-size:15px;font-weight:500;margin:0 0 10px}
.alt p{margin:0;font-size:15px}
.alt .alt-title{color:var(--muted);font-size:14px}

.review{margin-top:44px;padding-top:28px;border-top:1px solid var(--line)}
.review .hint{font-size:13px;color:var(--muted);margin:0 0 16px}
.rating{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.rating-label{font-size:13px;color:var(--muted);margin-right:6px}
.dot{width:30px;height:30px;padding:0;background:none;border:0;display:grid;place-items:center}
.dot span{display:block;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--olive);transition:background .15s}
.dot.on span{background:var(--olive)}
textarea,.input{width:100%;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font:inherit;font-size:16px;color:var(--navy);resize:none}
textarea{height:96px;line-height:1.55}
textarea::placeholder,.input::placeholder{color:#9A988B}
.field-row{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.field-row .input{flex:1}
.count{font-family:var(--lat);font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.review .primary{margin-top:16px}
.form-msg{font-size:14px;margin:12px 0 0;color:#8A3B2E}
.thanks{padding:20px 18px;background:var(--paper);border-left:2px solid var(--olive)}
.thanks strong{display:block;font-weight:500;margin-bottom:4px}
.thanks p{margin:0;font-size:14px;color:var(--muted)}
.actions{margin-top:28px;display:grid;gap:10px}
.restart{background:none;border:0;padding:10px 0;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* reveal: the one orchestrated moment */
.reveal line{transform-box:fill-box;transform-origin:center;transform:scaleX(0);animation:layer .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i) * 90ms)}
@keyframes layer{to{transform:scaleX(1)}}
.reveal-text{opacity:0;animation:fade .6s ease forwards;animation-delay:.75s}
@keyframes fade{to{opacity:1}}

/* toast & sheet */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 18px;background:var(--navy);color:var(--paper);font-size:14px;border-radius:2px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.sheet-bg{position:fixed;inset:0;background:rgba(29,42,68,.35);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-width:460px;background:var(--linen);padding:24px;border-top:2px solid var(--navy)}
.sheet h3{margin:0 0 6px;font-size:16px;font-weight:500}
.sheet p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.sheet textarea{height:120px;font-size:14px}
.sheet .ghost{margin-top:12px}

/* ---------- board (in-store display) ---------- */
.board{min-height:100vh;min-height:100dvh;padding:5vh 6vw;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-template-rows:auto 1fr auto;column-gap:6vw;row-gap:4vh}
.board-head{grid-column:1 / -1;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--navy);padding-bottom:2.2vh}
.board-head h1{margin:0;font-size:clamp(26px,3.4vw,46px);font-weight:500;line-height:1.15}
.board-head h1 small{display:block;font-family:var(--lat);font-weight:300;font-size:.48em;letter-spacing:.04em;color:var(--olive);margin-top:.5em}
.board-brand{text-align:right;font-family:var(--lat)}
.board-brand b{display:block;font-weight:300;font-size:clamp(22px,2.6vw,36px);letter-spacing:.05em}
.board-brand span{font-size:clamp(12px,1.1vw,15px);color:var(--olive)}
.ranks h2,.voices h2{font-size:clamp(14px,1.25vw,17px);font-weight:500;color:var(--muted);margin:0 0 2.4vh}
.rank{display:grid;grid-template-columns:2.4em 1fr;gap:.6em;padding:2vh 0;border-bottom:1px solid var(--line)}
.rank-n{font-family:var(--lat);font-weight:300;font-size:clamp(26px,2.8vw,40px);line-height:1;color:var(--olive)}
.rank-title{font-size:clamp(17px,1.7vw,24px);font-weight:500;line-height:1.3}
.rank-pair{font-size:clamp(13px,1.15vw,16px);color:var(--muted);margin-top:.2em}
.rank-count{font-family:var(--lat);font-size:clamp(12px,1vw,14px);color:var(--olive);margin-top:.35em}
.voices{display:flex;flex-direction:column;min-height:0}
.quote-wrap{position:relative;flex:1;min-height:30vh}
.quote{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .9s ease}
.quote.on{opacity:1}
.quote blockquote{margin:0;font-size:clamp(22px,2.7vw,40px);font-weight:400;line-height:1.5;letter-spacing:-.01em}
.quote blockquote::before{content:"\201C";display:block;font-family:var(--lat);font-weight:300;font-size:2.2em;line-height:.6;color:var(--olive-soft);margin-bottom:.15em}
.quote .who{margin-top:3vh;font-size:clamp(13px,1.2vw,17px);color:var(--muted)}
.quote .who b{font-weight:500;color:var(--navy)}
.quote-dots{display:flex;gap:6px;margin-top:2vh}
.quote-dots i{width:18px;height:2px;background:var(--line)}
.quote-dots i.on{background:var(--navy)}
.board-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:2vh;font-size:clamp(13px,1.15vw,16px);color:var(--muted)}
.board-foot b{color:var(--navy);font-weight:500}
.board-empty{font-size:clamp(16px,1.6vw,22px);color:var(--muted);line-height:1.6}
.sample-flag{font-size:12px;color:#8A3B2E}
@media (max-width:760px){
  .board{grid-template-columns:1fr;padding:28px 22px}
  .quote-wrap{min-height:260px}
}

/* ---------- QR cards ---------- */
.qr-page{max-width:880px;margin:0 auto;padding:32px 24px 60px}
.qr-page h1{font-size:24px;font-weight:500;margin:0}
.qr-page .desc{margin-top:8px}
.qr-controls{display:grid;grid-template-columns:1fr 120px;gap:12px;margin-top:24px}
.qr-controls label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.qr-controls .input{font-size:14px}
.qr-buttons{display:flex;gap:10px;margin-top:16px}
.qr-buttons .primary,.qr-buttons .ghost{margin:0;width:auto;padding:13px 22px}
.qr-warn{font-size:13px;color:#8A3B2E;margin-top:10px}
.qr-grid{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.qr-card{background:var(--paper);border:1px solid var(--line);padding:26px 22px 22px;text-align:center;break-inside:avoid;page-break-inside:avoid}
.qr-card .layers{width:44px;margin:0 auto 12px}
.qr-card .qb{font-family:var(--lat);font-weight:300;font-size:26px;letter-spacing:.05em;line-height:1}
.qr-card .qs{font-family:var(--lat);font-size:11px;color:var(--olive);margin-top:6px}
.qr-card .qt{font-size:16px;font-weight:500;margin-top:18px}
.qr-card .qe{font-family:var(--lat);font-size:12px;color:var(--muted)}
.qr-img{width:150px;height:150px;margin:16px auto 12px;background:#fff;padding:8px}
.qr-img svg{width:100%;height:100%;display:block}
.qr-card .qn{font-family:var(--lat);font-size:13px;color:var(--navy);letter-spacing:.04em}
.qr-card .qh{font-size:11px;color:var(--muted);margin-top:4px}

/* demo bar */
.demo-bar{position:fixed;right:12px;bottom:12px;z-index:20;display:flex;gap:2px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:4px 6px;font-size:12px;border-radius:2px}
.demo-bar span{color:#8A3B2E;padding:0 6px}
.demo-bar a{padding:4px 8px;text-decoration:none;color:var(--muted)}
.demo-bar a.on{color:var(--navy);font-weight:500;text-decoration:underline;text-underline-offset:3px}

@media print{
  body{background:#fff}
  .no-print,.demo-bar{display:none!important}
  .qr-page{padding:0;max-width:none}
  .qr-grid{grid-template-columns:repeat(2,1fr);gap:10mm;margin:0}
  .qr-card{border:1px solid #bbb}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important}
}
</style>
</head>

/* 서버 호출: Apps Script 화면이면 google.script.run, 외부 배포면 fetch, 미리보기면 데모 저장소 */
function call(fn){
  const args=[].slice.call(arguments,1);
  if(GAS) return new Promise((resolve,reject)=>{ const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject); r[fn].apply(r,args); });
  if(API){
    const req = fn==='getWeeklyPicks'
      ? fetch(API_URL+'?action=picks&t='+Date.now())
      : fetch(API_URL,{method:'POST', body:JSON.stringify({action:fn, args})}); // text/plain 이라 사전 요청(CORS preflight) 없이 전송됩니다
    return req.then(r=>r.json()).then(j=>{ if(!j || j.ok===false) throw new Error((j&&j.error)||'server error'); return j.data; });
  }
  return new Promise((resolve,reject)=>{ try{ setTimeout(()=>resolve(Demo[fn].apply(null,args)),250); }catch(e){ reject(e); } });
}
const Demo = (function(){
  const now=Date.now(), h=3600e3;

  ];
  const extra=[7,7,1,1,1,15,8,3,3,10,1,7];

  return {
    logResult(p){ return {id:'demo-'+(++seq)}; },
    submitReview(id,rv,p){ rows.unshift({pid:p&&p.pairingId,c:rv.comment,n:rv.nickname,r:rv.rating,t:Date.now()}); return {ok:true}; },
    getWeeklyPicks(){
      const counts={}; rows.forEach(r=>counts[r.pid]=(counts[r.pid]||0)+1); extra.forEach(id=>counts[id]=(counts[id]||0)+1);
      const top=Object.keys(counts).map(id=>({id:Number(id),count:counts[id]})).sort((a,b)=>b.count-a.count).slice(0,3);
      const monday=new Date(); monday.setHours(0,0,0,0); monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
      return {total:rows.length+extra.length, top, reviews:rows.map(r=>({pairingId:r.pid,comment:r.c,nickname:r.n,rating:r.r,time:r.t})), since:monday.getTime(), sample:true};
    }
  };
})();

const S={lang:null, step:'lang', qi:0, answers:{}, result:null, alt:null, logId:null, rating:0, reviewed:false};

function recommend(a){
  const scored=PAIRINGS.map(p=>({p, s:(p.d.includes(a.drink)?4:0)+(p.t.includes(a.taste)?3:0)+(p.e.includes(a.energy)?2:0)+(p.m.includes(a.mood)?1:0)+Math.random()*0.5}));
  scored.sort((x,y)=>y.s-x.s);
  const main=scored[0].p;
  const altPick=scored.slice(1).find(x=>x.p.ko.drink!==main.ko.drink && x.p.ko.pastry!==main.ko.pastry);
  return {main, alt:(altPick||scored[1]).p};
}
function kw(qkey,v,lang){ const q=QUESTIONS.find(q=>q.key===qkey); const o=q.options.find(o=>o.v===v); return o?(lang==='en'?o.kwEn:o.kwKo):''; }

function payload(){
  return {lang:S.lang, table:TABLE, mood:kw('mood',S.answers.mood,'ko'), energy:kw('energy',S.answers.energy,'ko'),
    taste:kw('taste',S.answers.taste,'ko'), drink:kw('drink',S.answers.drink,'ko'),
    pairingId:S.result.id, pairingName:`[${S.result.ko.title}] ${S.result.ko.drink} + ${S.result.ko.pastry}`};
}
function finish(){
  const r=recommend(S.answers); S.result=r.main; S.alt=r.alt; S.logId=null; S.rating=0; S.reviewed=false; S.revealed=false; S.draft=null;
  S.step='result'; render(); window.scrollTo(0,0);
  call('logResult',payload()).then(res=>{ S.logId=res&&res.id; }).catch(()=>{});
}
function submitReview(e){
  e.preventDefault();
  const t=T[S.lang], cm=document.getElementById('cm'), msg=document.getElementById('fmsg'), btn=document.getElementById('rsub');
  const comment=cm.value.trim(), nickname=document.getElementById('nk').value.trim();
  if(!comment){ msg.textContent=t.needText; msg.hidden=false; cm.focus(); return; }
  msg.hidden=true; btn.disabled=true; btn.textContent=t.saving;
  call('submitReview', S.logId, {rating:S.rating, comment, nickname}, payload())
    .then(()=>{ S.reviewed=true; S.draft=null; const sec=document.querySelector('.review'); sec.querySelector('form').outerHTML=`<div class="thanks"><strong>${t.thanksT}</strong><p>${t.thanksP}</p></div>`; })
    .catch(()=>{ msg.textContent=t.saveFail; msg.hidden=false; btn.disabled=false; btn.textContent=t.submit; });
}

/* 공유 */
async function copyText(text){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove(); return ok; }catch(e){ return false; }
}
async function share(){
  const t=T[S.lang], text=t.shareText(S.result), full=APP_URL?`${text}\n${APP_URL}`:text;
  if(navigator.share){
    try{ await navigator.share(APP_URL?{title:'Ordonne',text,url:APP_URL}:{title:'Ordonne',text}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  if(await copyText(full)){ toast(t.copied); return; }
  const bg=document.createElement('div'); bg.className='sheet-bg';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sht"><h3 id="sht">${t.sheetT}</h3><p>${t.sheetP}</p><textarea readonly>${esc(full)}</textarea><button class="ghost" data-close>${t.close}</button></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click',e=>{ if(e.target===bg||e.target.hasAttribute('data-close')) close(); });
  bg.querySelector('textarea').select();
}

/* 이벤트 */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el || !$app.contains(el)) return;
  const act=el.dataset.act, v=el.dataset.v;
  if(act==='lang'){ S.lang=v; S.step='intro'; render(); }
  else if(act==='toggle-lang'){ S.lang=S.lang==='ko'?'en':'ko'; render(); }
  else if(act==='home'){ S.step='lang'; S.qi=0; S.answers={}; render(); }
  else if(act==='start'){ S.step='q'; S.qi=0; S.answers={}; render(); }
  else if(act==='answer'){
    const q=QUESTIONS[S.qi]; S.answers[q.key]=v;
    $app.querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v)));
    setTimeout(()=>{ if(S.qi<QUESTIONS.length-1){ S.qi++; render(); } else finish(); },260);
  }
  else if(act==='back'){ if(S.qi>0){ S.qi--; render(); } else { S.step='intro'; render(); } }
  else if(act==='rate'){ S.rating=Number(v); $app.querySelectorAll('.dot').forEach(d=>{ const n=Number(d.dataset.v); d.classList.toggle('on',n<=S.rating); d.setAttribute('aria-pressed',String(n===S.rating)); }); }
  else if(act==='share'){ share(); }
  else if(act==='restart'){ S.step='intro'; S.qi=0; S.answers={}; render(); window.scrollTo(0,0); }
});

/* ===================== 매장 디스플레이: 이번 주 손님들의 픽 ===================== */
let boardTimer, rotateTimer;
function renderBoard(){
  document.documentElement.lang='ko';
  $app.innerHTML=`<main class="board"><div class="board-head"><h1>이번 주 손님들의 픽<small>This week’s picks</small></h1><div class="board-brand"><b>Ordonne</b><span>We bake Croissant</span></div></div><div class="board-empty">불러오는 중</div></main>`;
  loadBoard(); clearInterval(boardTimer); boardTimer=setInterval(loadBoard, 3*60*1000);
}
function loadBoard(){
  call('getWeeklyPicks').then(drawBoard).catch(()=>{
    const m=$app.querySelector('.board-empty'); if(m) m.textContent='손님들의 픽을 불러오지 못했어요. 인터넷 연결을 확인하면 3분 안에 다시 불러옵니다.';
  });
}
function drawBoard(data){
  const since=new Date(data.since);
  const sinceTxt=`${since.getMonth()+1}월 ${since.getDate()}일 월요일부터`;
  const ranks = data.top.length ? data.top.map((r,i)=>{ const p=byId(r.id); if(!p) return ''; return `<div class="rank"><span class="rank-n">${i+1}</span><div><div class="rank-title">${esc(p.ko.title)}</div><div class="rank-pair">${esc(p.ko.drink)} + ${esc(p.ko.pastry)}</div><div class="rank-count">${r.count}명이 만났어요</div></div></div>`; }).join('')
    : `<p class="board-empty">이번 주에는 아직 참여한 손님이 없어요.</p>`;
  const reviews=data.reviews||[];
  const quotes = reviews.length ? reviews.map((r,i)=>{ const p=byId(r.pairingId); const who=r.nickname?esc(r.nickname):'익명의 손님'; return `<div class="quote ${i===0?'on':''}"><blockquote>${esc(r.comment)}</blockquote><p class="who"><b>${who}</b>${p?`, ${esc(p.ko.drink)} + ${esc(p.ko.pastry)}`:''}</p></div>`; }).join('')
    : `<div class="quote on"><p class="board-empty">아직 이번 주 감상평이 없어요.<br>테이블의 QR 코드로 첫 번째 픽을 남겨 주세요.</p></div>`;
  $app.innerHTML=`<main class="board">
    <div class="board-head"><h1>이번 주 손님들의 픽<small>This week’s picks</small></h1><div class="board-brand"><b>Ordonne</b><span>We bake Croissant</span></div></div>
    <section class="ranks"><h2>가장 많이 만난 페어링</h2>${ranks}</section>
    <section class="voices"><h2>손님들이 남긴 한 줄</h2><div class="quote-wrap">${quotes}</div>${reviews.length>1?`<div class="quote-dots">${reviews.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div>`:''}</section>
    <div class="board-foot"><span>테이블의 QR 코드로 오늘의 페어링을 찾아보세요. Scan the QR on your table.</span><span>${sinceTxt} <b>${data.total}명</b> 참여${data.sample?' <span class="sample-flag">(미리보기 예시 데이터)</span>':''}</span></div>
  </main>`;
  clearInterval(rotateTimer);
  if(reviews.length>1){
    let k=0; const qs=$app.querySelectorAll('.quote'), ds=$app.querySelectorAll('.quote-dots i');
    rotateTimer=setInterval(()=>{ qs[k].classList.remove('on'); ds[k].classList.remove('on'); k=(k+1)%qs.length; qs[k].classList.add('on'); ds[k].classList.add('on'); }, 8000);
  }
}

/* ===================== 테이블 QR 카드 ===================== */
function qrSVG(text){
  const q=qrcode(0,'M'); q.addData(encodeURI(decodeURI(text))); q.make();
  return q.createSvgTag({cellSize:4, margin:0, scalable:true}).replace(/fill="#000000"|fill="black"/g,'fill="#1D2A44"');
}
function renderQR(){
  document.documentElement.lang='ko';
  const base=APP_URL||'https://아이디.github.io/ordonne/';
  $app.innerHTML=`<main class="qr-page">
    <div class="no-print">
      <h1>테이블 QR 카드</h1>
      <p class="desc">테이블 번호가 담긴 QR 카드를 만듭니다. 손님이 어느 테이블에서 참여했는지 시트에 함께 기록돼요.</p>
      <div class="qr-controls">
        <div><label for="qrBase">웹앱 주소</label><input class="input" id="qrBase" value="${esc(base)}"></div>
        <div><label for="qrN">테이블 수</label><input class="input" id="qrN" type="number" min="1" max="60" value="10"></div>
      </div>
      ${APP_URL?'':'<p class="qr-warn">미리보기 화면입니다. 배포한 페이지 주소에 ?view=qr 을 붙여 열면 실제 주소가 자동으로 들어갑니다.</p>'}
      <div class="qr-buttons"><button class="primary" id="qrMake">QR 카드 만들기</button><button class="ghost" id="qrPrint">인쇄하기</button></div>
    </div>
    <div class="qr-grid" id="qrGrid"></div>
  </main>`;
  document.getElementById('qrMake').onclick=makeQR;
  document.getElementById('qrPrint').onclick=()=>{ try{ window.print(); }catch(e){ toast('인쇄가 막혀 있어요. 화면을 캡처해 인쇄해 주세요.'); } };
  makeQR();
}
function makeQR(){
  const base=document.getElementById('qrBase').value.trim();
  const n=Math.max(1,Math.min(60,parseInt(document.getElementById('qrN').value,10)||1));
  const grid=document.getElementById('qrGrid');
  grid.innerHTML=Array.from({length:n},(_,i)=>`<article class="qr-card">${layersSVG()}<div class="qb">Ordonne</div><div class="qs">We bake Croissant</div><div class="qt">오늘의 페어링 테스트</div><div class="qe">Today’s Pairing Test</div><div class="qr-img" id="qr${i+1}"></div><div class="qn">Table ${i+1}</div><div class="qh">카메라로 스캔해 보세요. Scan with your camera.</div></article>`).join('');
  for(let i=1;i<=n;i++){
    const url=base+(base.includes('?')?'&':'?')+'table='+i;
    try{ document.getElementById('qr'+i).innerHTML=qrSVG(url); }
    catch(e){ toast('웹앱 주소가 너무 길거나 형식이 맞지 않아 QR을 만들지 못했어요.'); break; }
  }
}

/* ===================== 시작 ===================== */
function currentView(){
  if(GAS) return CONFIG.view||'test';
  if(API){ const q=QS.get('view'); return (q==='board'||q==='qr')?q:'test'; }
  const h=location.hash.replace('#','');
  return (h==='board'||h==='qr')?h:'test';
}
function boot(){
  clearInterval(boardTimer); clearInterval(rotateTimer);
  const v=currentView();
  if(v==='board') renderBoard(); else if(v==='qr') renderQR(); else render();
  if(!LIVE) drawDemoBar(v);
}
function drawDemoBar(v){
  let bar=document.getElementById('demoBar');
  document.body.classList.add('demo');
  if(!bar){ bar=document.createElement('nav'); bar.id='demoBar'; bar.className='demo-bar'; bar.setAttribute('aria-label','미리보기 화면 전환'); document.body.appendChild(bar); }
  bar.innerHTML=`<span>미리보기</span><a href="#test" class="${v==='test'?'on':''}">테스트</a><a href="#board" class="${v==='board'?'on':''}">손님들의 픽</a><a href="#qr" class="${v==='qr'?'on':''}">QR 카드</a>`;
}
window.addEventListener('hashchange',()=>{ if(!LIVE) boot(); });
boot();
</script>
